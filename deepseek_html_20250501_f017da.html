<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellu Babi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 85L20 55Q15 50 15 42t5-13q5-5 12-5t13 5l5 5 5-5q5-5 12-5t13 5q5 5 5 12.5T80 55L50 85z" fill="%2300f" opacity="0.1"/></svg>');
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-align: center;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .page {
            display: none;
        }

        .active-page {
            display: block;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
        }

        button {
            display: block;
            margin: 1rem auto;
            padding: 1rem 2rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background-color: #00f;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Trang 1 -->
        <div class="page active-page" id="page1">
            <h1>hellu babi, hà yêu khôi ko?</h1>
            <button onclick="showResult(1)">1. Có tui yêu ông (nhưng ông dc có 2 vợ)</button>
            <button onclick="showResult(2)">2. Có tui yêu ông (nhưng ông dc có 3 vợ)</button>
        </div>

        <!-- Trang 2 -->
        <div class="page" id="page2">
            <h1>cảm ơn bà hihi ❤️</h1>
        </div>
    </div>

    <script>
        function showResult(option) {
            document.getElementById('page1').classList.remove('active-page');
            document.getElementById('page2').classList.add('active-page');
        }
    </script>
</body>
</html>
